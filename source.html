<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESA Quiz - Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0a1a;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* ===== Full-screen question display ===== */

    .question-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      opacity: 0;
      transform: scale(0.95);
    }

    .question-screen.show {
      animation: screenIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .question-screen.hide {
      animation: screenOut 0.4s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes screenIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes screenOut {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.95); }
    }

    .question-meta {
      display: flex;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(-20px);
    }

    .meta-round {
      font-size: 28px;
      font-weight: 700;
      color: #e0b060;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .meta-separator {
      font-size: 24px;
      color: #3d2a5c;
    }

    .meta-player {
      font-size: 28px;
      font-weight: 600;
      color: #a08cc0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .meta-question {
      font-size: 28px;
      font-weight: 600;
      color: #6b4d8a;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .question-text {
      font-size: 64px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: 1.3;
      max-width: 90vw;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(20px);
    }

    .question-text b {
      color: #e0b060;
    }

    .question-text i {
      font-style: italic;
      color: #c0a0e0;
    }

    .question-image {
      margin-top: 40px;
      max-width: 700px;
      max-height: 450px;
      border-radius: 12px;
      border: 3px solid #6b4d8a;
      object-fit: contain;
      opacity: 0;
      transform: translateY(20px);
    }

    /* Staggered reveals */
    .question-screen.show .question-meta {
      animation: revealDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.1s;
    }

    .question-screen.show .question-text {
      animation: revealUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.25s;
    }

    .question-screen.show .question-image {
      animation: revealUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.45s;
    }

    .question-screen.hide .question-meta,
    .question-screen.hide .question-text,
    .question-screen.hide .question-image {
      animation: hideEl 0.2s ease-in forwards;
    }

    @keyframes revealDown {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes revealUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes hideEl {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }

    /* ===== Answer display ===== */

    .answer-bar {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(calc(100% + 120px));
      display: flex;
      align-items: stretch;
      opacity: 0;
      z-index: 10;
    }

    .answer-bar.show {
      animation: barIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .answer-bar.hide {
      animation: barOut 0.4s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes barIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(calc(100% + 120px)); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes barOut {
      0% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(calc(100% + 120px)); }
    }

    .answer-accent {
      background: linear-gradient(135deg, #2d1b4e 0%, #1a1030 100%);
      padding: 24px 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px 0 0 12px;
      border: 3px solid #6b4d8a;
      border-right: none;
      flex-shrink: 0;
    }

    .answer-accent-text {
      font-size: 22px;
      font-weight: 700;
      color: #e0b060;
      text-transform: uppercase;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .answer-content {
      background: linear-gradient(135deg, #3d2a5c 0%, #2a1d42 100%);
      border-radius: 0 12px 12px 0;
      border: 3px solid #6b4d8a;
      border-left: none;
      position: relative;
      overflow: hidden;
      padding: 24px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 400px;
    }

    .answer-content::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: linear-gradient(180deg, #f0a030 0%, #d4841f 100%);
      z-index: 1;
    }

    .answer-text {
      font-size: 52px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
      line-height: 1.3;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-20px);
    }

    .answer-text b { color: #ffffff; }
    .answer-text u { color: #e0b060; text-decoration: none; font-weight: 700; }
    .answer-text i { color: #c0a0e0; }

    .answer-notes {
      font-size: 26px;
      font-weight: 500;
      color: #a08cc0;
      margin-top: 8px;
      opacity: 0;
      transform: translateX(-20px);
    }

    .answer-bar.show .answer-text {
      animation: textReveal 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.2s;
    }

    .answer-bar.show .answer-notes {
      animation: textReveal 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.3s;
    }

    .answer-bar.hide .answer-text,
    .answer-bar.hide .answer-notes {
      animation: textHide 0.15s ease-in forwards;
    }

    @keyframes textReveal {
      0% { opacity: 0; transform: translateX(-20px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes textHide {
      0% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-10px); }
    }

    /* ===== Leaderboard ===== */

    .leaderboard-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      opacity: 0;
      transform: scale(0.95);
      z-index: 20;
    }

    .leaderboard-screen.show {
      animation: screenIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .leaderboard-screen.hide {
      animation: screenOut 0.4s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    .leaderboard-title {
      font-size: 32px;
      font-weight: 700;
      color: #e0b060;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(-20px);
    }

    .leaderboard-screen.show .leaderboard-title {
      animation: revealDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.15s;
    }

    .leaderboard-screen.hide .leaderboard-title {
      animation: hideEl 0.2s ease-in forwards;
    }

    .leaderboard-table {
      width: 100%;
      max-width: 1200px;
    }

    .lb-row {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 24px 36px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #2a1d42 0%, #1a1030 100%);
      border: 3px solid #6b4d8a;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateX(-40px);
    }

    .lb-row::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: linear-gradient(180deg, #f0a030 0%, #d4841f 100%);
    }

    .lb-row.first {
      border-color: #e0b060;
      background: linear-gradient(135deg, #3d2a5c 0%, #2a1d42 100%);
    }

    .lb-row.first::before {
      width: 7px;
    }

    .leaderboard-screen.show .lb-row {
      animation: lbRowIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .leaderboard-screen.hide .lb-row {
      animation: hideEl 0.2s ease-in forwards;
    }

    @keyframes lbRowIn {
      0% { opacity: 0; transform: translateX(-40px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .lb-rank {
      font-size: 48px;
      font-weight: 700;
      color: #6b4d8a;
      min-width: 72px;
      text-align: center;
    }

    .lb-row.first .lb-rank {
      color: #e0b060;
    }

    .lb-name {
      font-size: 42px;
      font-weight: 700;
      color: #ffffff;
      flex: 1;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
    }

    .lb-score {
      font-size: 48px;
      font-weight: 700;
      color: #e0b060;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
    }

    .lb-score-suffix {
      font-size: 24px;
      font-weight: 500;
      color: #a08cc0;
      margin-left: 6px;
    }

    /* ===== Idle / waiting screen ===== */

    .idle-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    .idle-screen.show {
      animation: screenIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .idle-screen.hide {
      animation: screenOut 0.4s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    .idle-text {
      font-size: 36px;
      font-weight: 600;
      color: #3d2a5c;
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    /* ===== Background decoration ===== */

    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(107, 77, 138, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .bg-glow.top-right { top: -200px; right: -200px; }
    .bg-glow.bottom-left { bottom: -200px; left: -200px; }

    /* ===== Holding screen ===== */

    .holding-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0a1a;
      opacity: 0;
    }

    .holding-screen.show {
      animation: holdingIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .holding-screen.hide {
      animation: holdingOut 0.6s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes holdingIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes holdingOut {
      0% { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }

    .holding-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(224, 176, 96, 0.06) 0%, rgba(107, 77, 138, 0.04) 40%, transparent 70%);
      animation: holdingPulse 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes holdingPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .holding-logo {
      position: relative;
      width: 280px;
      height: 280px;
      margin-bottom: 56px;
      opacity: 0;
      transform: translateY(20px);
    }

    .holding-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .holding-logo-placeholder {
      width: 100%;
      height: 100%;
      border: 3px solid #2a1d42;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      font-weight: 700;
      color: #e0b060;
      letter-spacing: 4px;
      background: linear-gradient(135deg, rgba(42, 29, 66, 0.5) 0%, rgba(15, 10, 26, 0.5) 100%);
    }

    .holding-title {
      position: relative;
      font-size: 60px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 12px;
      text-align: center;
      line-height: 1.3;
      opacity: 0;
      transform: translateY(20px);
    }

    .holding-subtitle {
      position: relative;
      font-size: 28px;
      font-weight: 500;
      color: #6b4d8a;
      text-transform: uppercase;
      letter-spacing: 6px;
      margin-top: 24px;
      opacity: 0;
      transform: translateY(20px);
    }

    .holding-screen.show .holding-logo {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.3s;
    }

    .holding-screen.show .holding-title {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.5s;
    }

    .holding-screen.show .holding-subtitle {
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.7s;
    }

    .holding-screen.hide .holding-logo,
    .holding-screen.hide .holding-title,
    .holding-screen.hide .holding-subtitle {
      animation: hideEl 0.3s ease-in forwards;
    }
  </style>
</head>
<body>
  <div class="bg-glow top-right"></div>
  <div class="bg-glow bottom-left"></div>

  <div id="holdingDisplay"></div>
  <div id="questionDisplay"></div>
  <div id="answerDisplay"></div>
  <div id="leaderboardDisplay"></div>
  <div id="idleDisplay"></div>

  <script>
    const holdingDisplay = document.getElementById('holdingDisplay');
    const questionDisplay = document.getElementById('questionDisplay');
    const answerDisplay = document.getElementById('answerDisplay');
    const leaderboardDisplay = document.getElementById('leaderboardDisplay');
    const idleDisplay = document.getElementById('idleDisplay');

    let holdingVisible = false;
    let questionVisible = false;
    let answerVisible = false;
    let leaderboardVisible = false;

    const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    let ws;

    function connect() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => ws.send(JSON.stringify({ type: 'pong' }));
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        switch (data.type) {
          case 'show_holding':
            showHolding(data);
            break;
          case 'hide_holding':
            hideHolding();
            break;
          case 'show_question':
            handleShowQuestion(data);
            break;
          case 'hide_question':
            hideQuestion();
            break;
          case 'show_answer':
            handleShowAnswer(data);
            break;
          case 'hide_answer':
            hideAnswer();
            break;
          case 'show_leaderboard':
            handleShowLeaderboard(data);
            break;
          case 'hide_leaderboard':
            hideLeaderboard();
            break;
          case 'hide_all':
            hideAll();
            break;
          case 'ping':
            ws.send(JSON.stringify({ type: 'pong' }));
            break;
        }
      };
      ws.onclose = () => setTimeout(connect, 2000);
    }
    connect();

    // ===== Holding screen =====

    function showHolding(data) {
      // Hide everything else first
      hideQuestion();
      hideAnswer();
      hideLeaderboard();

      const title = escHtml(data.title || 'ESA Quiz');
      const subtitle = escHtml(data.subtitle || '');
      const logoUrl = data.logoUrl || '';

      let logoHtml;
      if (logoUrl) {
        logoHtml = `<img src="${escHtml(logoUrl)}" alt="">`;
      } else {
        logoHtml = `<div class="holding-logo-placeholder">ESA</div>`;
      }

      let subtitleHtml = '';
      if (subtitle) {
        subtitleHtml = `<div class="holding-subtitle">${subtitle}</div>`;
      }

      holdingDisplay.innerHTML =
        `<div class="holding-screen">` +
          `<div class="holding-glow"></div>` +
          `<div class="holding-logo">${logoHtml}</div>` +
          `<div class="holding-title">${title}</div>` +
          subtitleHtml +
        `</div>`;

      void holdingDisplay.offsetWidth;
      holdingDisplay.querySelector('.holding-screen').classList.add('show');
      holdingVisible = true;
    }

    function hideHolding() {
      if (!holdingVisible) return;
      triggerHide(holdingDisplay, '.holding-screen');
      holdingVisible = false;
    }

    // ===== Question =====

    function handleShowQuestion(data) {
      // Hide leaderboard if showing
      if (leaderboardVisible) {
        hideLeaderboard();
        setTimeout(() => showQuestion(data), 450);
        return;
      }

      if (questionVisible) {
        triggerHide(questionDisplay, '.question-screen');
        hideAnswer();
        setTimeout(() => showQuestion(data), 450);
      } else {
        showQuestion(data);
      }
    }

    function parseRoundNo(roundNo) {
      // "Round 1 Player 1" -> { round: "Round 1", player: "Player 1" }
      const match = (roundNo || '').match(/^(Round\s+\d+)\s+(Player\s+\d+)$/i);
      if (match) return { round: match[1], player: match[2] };
      return { round: roundNo || '', player: '' };
    }

    function showQuestion(data) {
      const meta = parseRoundNo(data.roundNo);
      let html = `<div class="question-screen">`;
      html += `<div class="question-meta">`;
      html += `<span class="meta-round">${escHtml(meta.round)}</span>`;
      if (meta.player) {
        html += `<span class="meta-separator">/</span>`;
        html += `<span class="meta-player">${escHtml(meta.player)}</span>`;
      }
      if (data.questionNo) {
        html += `<span class="meta-separator">/</span>`;
        html += `<span class="meta-question">${escHtml(data.questionNo)}</span>`;
      }
      html += `</div>`;
      // questionText may contain HTML formatting (b, i tags) — allow it through
      html += `<div class="question-text">${sanitizeQuizHtml(data.questionText || '')}</div>`;

      if (data.imageUrl) {
        html += `<img class="question-image" src="${escHtml(data.imageUrl)}" alt="">`;
      }

      html += `</div>`;

      questionDisplay.innerHTML = html;
      void questionDisplay.offsetWidth;
      questionDisplay.querySelector('.question-screen').classList.add('show');
      questionVisible = true;
    }

    function hideQuestion() {
      if (!questionVisible) return;
      triggerHide(questionDisplay, '.question-screen');
      questionVisible = false;
    }

    // ===== Answer =====

    function handleShowAnswer(data) {
      if (answerVisible) {
        triggerHide(answerDisplay, '.answer-bar');
        setTimeout(() => showAnswer(data), 450);
      } else {
        showAnswer(data);
      }
    }

    function showAnswer(data) {
      let notesHtml = '';
      if (data.notes) {
        notesHtml = `<div class="answer-notes">${escHtml(data.notes)}</div>`;
      }

      answerDisplay.innerHTML =
        `<div class="answer-bar">` +
          `<div class="answer-accent"><span class="answer-accent-text">Answer</span></div>` +
          `<div class="answer-content">` +
            `<div class="answer-text">${sanitizeQuizHtml(data.answerText || '')}</div>` +
            notesHtml +
          `</div>` +
        `</div>`;

      void answerDisplay.offsetWidth;
      answerDisplay.querySelector('.answer-bar').classList.add('show');
      answerVisible = true;
    }

    function hideAnswer() {
      if (!answerVisible) return;
      triggerHide(answerDisplay, '.answer-bar');
      answerVisible = false;
    }

    // ===== Leaderboard =====

    function handleShowLeaderboard(data) {
      const players = data.players || [];

      if (questionVisible) {
        hideQuestion();
        hideAnswer();
        setTimeout(() => showLeaderboard(players), 450);
      } else if (leaderboardVisible) {
        triggerHide(leaderboardDisplay, '.leaderboard-screen');
        setTimeout(() => showLeaderboard(players), 450);
      } else {
        showLeaderboard(players);
      }
    }

    function showLeaderboard(players) {
      // Sort by score descending
      const sorted = [...players].sort((a, b) => b.score - a.score);

      let rowsHtml = '';
      sorted.forEach((p, i) => {
        const isFirst = i === 0;
        const delay = 0.25 + i * 0.08;
        rowsHtml +=
          `<div class="lb-row${isFirst ? ' first' : ''}" style="animation-delay: ${delay}s">` +
            `<span class="lb-rank">${i + 1}</span>` +
            `<span class="lb-name">${escHtml(p.name)}</span>` +
            `<span class="lb-score">${p.score}<span class="lb-score-suffix">pts</span></span>` +
          `</div>`;
      });

      leaderboardDisplay.innerHTML =
        `<div class="leaderboard-screen">` +
          `<div class="leaderboard-title">Leaderboard</div>` +
          `<div class="leaderboard-table">${rowsHtml}</div>` +
        `</div>`;

      void leaderboardDisplay.offsetWidth;
      leaderboardDisplay.querySelector('.leaderboard-screen').classList.add('show');
      leaderboardVisible = true;
    }

    function hideLeaderboard() {
      if (!leaderboardVisible) return;
      triggerHide(leaderboardDisplay, '.leaderboard-screen');
      leaderboardVisible = false;
    }

    // ===== Utilities =====

    function hideAll() {
      hideHolding();
      hideQuestion();
      hideAnswer();
      hideLeaderboard();
    }

    function triggerHide(container, selector) {
      const el = container.querySelector(selector);
      if (el) {
        el.classList.remove('show');
        el.classList.add('hide');
        el.addEventListener('animationend', () => {
          // Clear the container once the hide animation finishes
          // to prevent stale content from flickering on next show
          if (el.classList.contains('hide')) {
            container.innerHTML = '';
          }
        }, { once: true });
      }
    }

    function escHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function sanitizeQuizHtml(str) {
      // Allow only b, i, u tags from the quiz format — strip everything else
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/&lt;b&gt;/g, '<b>')
        .replace(/&lt;\/b&gt;/g, '</b>')
        .replace(/&lt;i&gt;/g, '<i>')
        .replace(/&lt;\/i&gt;/g, '</i>')
        .replace(/&lt;u&gt;/g, '<u>')
        .replace(/&lt;\/u&gt;/g, '</u>');
    }
  </script>
